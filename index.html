<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 class="title">My TODO List</h1>
    <div class="todo-box">
      <div class="input-section">
        <input id="input" placeholder="Add a new task...">
        <button class="btn-add" onclick="add()">Add</button>
      </div>
      <ul id="listcontainer"></ul>
    </div>
  </div>

  <script>
    const ul = document.getElementById("listcontainer");
    const input = document.getElementById("input");
    let todo = [];

    window.onload = () => {
      todo = JSON.parse(localStorage.getItem("todos")) || [];
      todo.forEach(t => displayTask(t));
    };

    function add() {
      if (input.value.trim() === "") return;
      todo.push(input.value);
      localStorage.setItem("todos", JSON.stringify(todo));
      displayTask(input.value);
      input.value = "";
    }

    function displayTask(task) {
      const listItem = document.createElement("li");
      listItem.classList.add("task-item");
      listItem.innerHTML = `
        <span>${task}</span>
        <div class="actions">
          <button class="btn-delete" onclick="deleteItem(event)">🗑</button>
        </div>
      `;
      ul.appendChild(listItem);
    }

    function deleteItem(event) {
      const item = event.target.closest("li");
      const text = item.querySelector("span").textContent;
      todo = todo.filter(t => t !== text);
      localStorage.setItem("todos", JSON.stringify(todo));
      item.classList.add("fade-out");
      setTimeout(() => item.remove(), 300);
    }
  </script>
</body>
</html>
